# Generated by manual/build.js in the Passio/passio repo. Do not edit here --
# edit manual/site/mkdocs.yml there, or your change will be overwritten.
site_name: Passio Navigator Manual
site_description: User manual for Passio Navigator
site_url: https://passio.github.io/navigator-manual/
repo_url: https://github.com/Passio/navigator-manual
edit_uri: ''

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search

extra_css:
  - assets/search.css
extra_javascript:
  - assets/search.js

extra:
  generator: false

